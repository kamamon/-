<title>ベビー フラッシュカード（写真版）</title>
<style>
:root{
  --jp:"Hiragino Maru Gothic ProN","Hiragino Sans","BIZ UDPGothic","Yu Gothic UI","Meiryo","Noto Sans JP",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --emoji:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#FFF8EE}
body{font-family:var(--jp);color:#3a3a3a;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation;overscroll-behavior:none}
button{font-family:inherit;cursor:pointer;border:0;background:none;color:inherit}

/* ---------- ホーム ---------- */
#home{max-width:820px;margin:0 auto;padding:calc(24px + env(safe-area-inset-top)) 16px calc(32px + env(safe-area-inset-bottom))}
.title{font-size:clamp(20px,6vw,28px);font-weight:900;text-align:center;white-space:nowrap}
.sub{text-align:center;color:#8a8a8a;font-size:14px;margin-top:8px;line-height:1.7}
.settings{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:18px 0 8px}
.toggle{border:2px solid #eadcc6;background:#fff;border-radius:999px;padding:9px 14px;font-size:14px;font-weight:700;color:#8a7f70}
.toggle.on{background:#FF8A65;border-color:#FF8A65;color:#fff}
.mix{display:block;width:100%;margin:12px 0 6px;padding:16px;border-radius:20px;background:#FFD54F;font-size:18px;font-weight:900;color:#5d4a00;box-shadow:0 3px 0 rgba(0,0,0,.08)}
.mix:active{transform:scale(.98)}
.gh{font-size:17px;font-weight:900;color:#7a6a55;margin:22px 4px 10px;display:flex;align-items:center;gap:6px}
.gh span{font-size:12px;font-weight:700;color:#b0a494;margin-left:auto}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media(min-width:600px){.grid{grid-template-columns:repeat(3,1fr)}}
@media(min-width:800px){.grid{grid-template-columns:repeat(4,1fr)}}
.deck{border-radius:20px;padding:14px 8px 12px;text-align:center;box-shadow:0 3px 0 rgba(0,0,0,.07);transition:transform .08s}
.deck:active{transform:scale(.95)}
.deck .ic{font-size:44px;line-height:1.15;font-family:var(--emoji)}
.deck .nm{font-size:16px;font-weight:900;margin-top:6px;color:#3a3a3a;line-height:1.25}
.deck .en{font-size:11px;color:rgba(0,0,0,.45);font-weight:700;margin-top:3px}
.foot{text-align:center;color:#a09a90;font-size:12px;margin-top:28px;line-height:1.8}

/* ---------- カード ---------- */
#card{position:fixed;inset:0;display:none;align-items:center;justify-content:center;overflow:hidden;touch-action:none;transition:background .25s;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
#card.show{display:flex}
.bgblur{position:absolute;inset:-60px;background-size:cover;background-position:center;filter:blur(30px) saturate(1.15);opacity:0;transition:opacity .5s;pointer-events:none;z-index:0}
.bgblur.on{opacity:.55}
.prog{position:absolute;top:0;left:0;height:5px;background:rgba(0,0,0,.18);transition:width .25s;border-radius:0 3px 3px 0;z-index:3}
.topbar{position:absolute;top:calc(10px + env(safe-area-inset-top));left:0;right:0;display:flex;align-items:center;justify-content:space-between;padding:0 12px;z-index:3}
.ibtn{width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.8);font-size:22px;box-shadow:0 2px 4px rgba(0,0,0,.1);display:flex;align-items:center;justify-content:center}
.counter{font-size:15px;font-weight:800;color:rgba(0,0,0,.45);background:rgba(255,255,255,.75);padding:6px 14px;border-radius:999px}
.badge{font-size:13px;font-weight:800;color:rgba(0,0,0,.45);background:rgba(255,255,255,.75);padding:6px 10px;border-radius:999px;min-width:44px;text-align:center}
.badge:empty{visibility:hidden}
.stage{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:0 12px;margin-top:2vh}
.stage.pop{animation:pop .3s cubic-bezier(.34,1.56,.64,1)}
@keyframes pop{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}
.pic{position:relative;width:min(94vw,760px);height:min(54vh,620px);display:flex;align-items:center;justify-content:center;font-size:clamp(110px,min(50vw,36vh),400px);line-height:1}
.emoji{font-family:var(--emoji);transition:opacity .3s}
.emoji.off{opacity:0}
#photo{position:absolute;inset:0;margin:auto;max-width:100%;max-height:100%;width:auto;height:auto;object-fit:contain;border-radius:22px;box-shadow:0 10px 36px rgba(0,0,0,.22);background:#fff;opacity:0;transition:opacity .35s;-webkit-user-drag:none;pointer-events:none}
#photo.on{opacity:1}
.pic svg{width:.92em;height:.92em;display:block}
.pic .ball{width:.85em;height:.85em;border-radius:50%;box-shadow:0 0 0 .03em rgba(0,0,0,.08),0 .04em .1em rgba(0,0,0,.12)}
.numwrap{display:flex;flex-direction:column;align-items:center;gap:.06em}
.num{font-family:var(--jp);font-weight:900;font-size:.72em;line-height:1}
.dots{display:flex;flex-wrap:wrap;justify-content:center;gap:.04em;width:.56em}
.dots i{display:block;width:.08em;height:.08em;border-radius:50%}
.word{font-size:clamp(28px,10vmin,84px);font-weight:900;letter-spacing:.03em;margin-top:2.5vh;white-space:nowrap;line-height:1.25;background:rgba(255,255,255,.9);padding:.08em .55em;border-radius:999px;box-shadow:0 4px 14px rgba(0,0,0,.08);max-width:96vw}
.word.long{font-size:clamp(22px,7.8vmin,66px)}
.word.xl{font-size:clamp(18px,6vmin,52px)}
.en{font-size:clamp(14px,4.4vmin,30px);font-weight:800;color:rgba(0,0,0,.5);margin-top:1.2vh;letter-spacing:.04em;background:rgba(255,255,255,.75);padding:.1em .8em;border-radius:999px}
.en.hide{display:none}
.hint{position:absolute;bottom:calc(30px + env(safe-area-inset-bottom));left:0;right:0;text-align:center;font-size:14px;font-weight:800;color:rgba(0,0,0,.45);transition:opacity .4s;z-index:3;padding:0 16px}
.hint.off{opacity:0}
.endbtns{display:flex;gap:12px;margin-top:3vh;flex-wrap:wrap;justify-content:center}
.endbtns button{font-size:18px;font-weight:900;padding:14px 22px;border-radius:999px;background:#fff;color:#444;box-shadow:0 3px 0 rgba(0,0,0,.08)}
.endbtns button.primary{background:#FF8A65;color:#fff}
.credit{position:absolute;right:calc(8px + env(safe-area-inset-right));bottom:calc(6px + env(safe-area-inset-bottom));max-width:72vw;font-size:10px;line-height:1.4;color:rgba(0,0,0,.5);background:rgba(255,255,255,.6);padding:0 6px;border-radius:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;z-index:3;pointer-events:none}
.credit:empty{display:none}
@media (orientation:landscape) and (max-height:520px){.stage{margin-top:0}.pic{height:min(48vh,620px);width:min(80vw,760px)}.word{margin-top:1.5vh}.endbtns{margin-top:1.5vh}.endbtns button{font-size:15px;padding:10px 16px}}
</style>
</head>

<div id="home">
  <h1 class="title">📷 ベビー フラッシュカード</h1>

<script>
const PALETTE=['#FFE3E8','#E3F0FF','#FFF6D6','#E6F7E9','#F3E6FF','#FFEBD9','#E0F7FA','#FDEBF5'];
const NUMCOL=['#E53935','#1E88E5','#43A047','#FB8C00','#8E24AA','#00ACC1','#F06292','#6D4C41','#3949AB','#00897B'];
const SHAPES={
 circle:'<circle cx="50" cy="50" r="44"/>',triangle:'<polygon points="50,6 94,90 6,90"/>',
 square:'<rect x="8" y="8" width="84" height="84" rx="6"/>',rect:'<rect x="4" y="26" width="92" height="48" rx="5"/>',
 star:'<polygon points="50,4 61.8,33.8 93.8,35.8 69,56.2 77,87.2 50,70 23,87.2 31,56.2 6.2,35.8 38.2,33.8"/>',
 heart:'<path d="M50 90C22 68 4 50 4 30C4 16 15 6 28 6C37 6 45 11 50 19C55 11 63 6 72 6C85 6 96 16 96 30C96 50 78 68 50 90Z"/>',
 diamond:'<polygon points="50,4 92,50 50,96 8,50"/>',oval:'<ellipse cx="50" cy="50" rx="47" ry="31"/>',
 crescent:'<path d="M68 6A46 46 0 1 0 68 94A52 52 0 0 1 68 6Z"/>',hexagon:'<polygon points="50,4 90,27 90,73 50,96 10,73 10,27"/>',
 pentagon:'<polygon points="50,5 95,38 78,92 22,92 5,38"/>',cross:'<path d="M36 6h28v30h30v28H64v30H36V64H6V36h30z"/>',
 arrow:'<polygon points="6,38 58,38 58,14 96,50 58,86 58,62 6,62"/>',trapezoid:'<polygon points="25,20 75,20 95,80 5,80"/>'
};
const $=s=>document.querySelector(s);
const home=$('#home'),card=$('#card'),stage=$('#stage'),pic=$('#pic'),emoji=$('#emoji'),photo=$('#photo'),bgblur=$('#bgblur'),
      word=$('#word'),en=$('#en'),counter=$('#counter'),prog=$('#prog'),badge=$('#badge'),hint=$('#hint'),endbtns=$('#endbtns'),credit=$('#credit');

/* ---- 設定 ---- */
let S={shuffle:false,en:true,auto:0,photo:true};
try{Object.assign(S,JSON.parse(localStorage.getItem('babyfc')||'{}'));}catch(e){}
function save(){try{localStorage.setItem('babyfc',JSON.stringify(S));}catch(e){}}

/* ---- 写真：Wikipedia 公式API（Action API）でデッキ分をまとめて取得 + キャッシュ ----
   Wikimedia は 2026年から決まった幅（20,40,60,120,250,330,500,960,1280,1920,3840）以外の
   サムネイルを HTTP 400 で拒否するので、URLは自作せず API が返したものをそのまま使う */
const API='https://en.wikipedia.org/w/api.php',IMG_W=960,TTL=14*864e5,CK='babyfc_img2';
const mem={},imgP={};
let store={},saveT=null,fails=0,warned=false;
try{store=JSON.parse(localStorage.getItem(CK)||'{}')||{};}catch(e){store={};}
try{localStorage.removeItem('babyfc_img');}catch(e){}
function saveStore(){clearTimeout(saveT);saveT=setTimeout(()=>{try{localStorage.setItem(CK,JSON.stringify(store));}catch(e){}},800);}
function titleOf(it){return (typeof it[0]==='string')?(it[3]!==undefined?it[3]:it[2]):null;}
function fetchBatch(titles){
  const q='action=query&format=json&formatversion=2&origin=*&redirects=1&prop=pageimages&piprop=thumbnail%7Cname&pilicense=free&pithumbsize='+IMG_W+'&pilimit=50&titles='+encodeURIComponent(titles.join('|'));
  return fetch(API+'?'+q).then(r=>r.ok?r.json():Promise.reject(r.status)).then(d=>{
    const qq=(d&&d.query)||{},norm={},redir={},pages={},out={},now=Date.now();
    (qq.normalized||[]).forEach(n=>{norm[n.from]=n.to;});
    (qq.redirects||[]).forEach(n=>{redir[n.from]=n.to;});
    (qq.pages||[]).forEach(p=>{pages[p.title]=p;});
    titles.forEach(t=>{
      let k=norm[t]||t;
      for(let i=0;i<4&&redir[k];i++)k=redir[k];
      const p=pages[k],th=p&&p.thumbnail;
      const v=(th&&th.source)?{u:th.source,n:p.pageimage||''}:null;
      out[t]=v;store[t]=[v,now];
    });
    saveStore();return out;
  }).catch(()=>{titles.forEach(t=>{delete mem[t];});netFail();return {};});
}
function resolveMany(titles){
  const need=[];
  titles.forEach(t=>{
    if(!t||mem[t])return;
    const c=store[t];
    if(c&&Date.now()-c[1]<TTL){mem[t]=Promise.resolve(c[0]);return;}
    if(need.indexOf(t)<0)need.push(t);
  });
  for(let i=0;i<need.length;i+=50){
    const chunk=need.slice(i,i+50),p=fetchBatch(chunk);
    chunk.forEach(t=>{mem[t]=p.then(o=>o[t]||null);});
  }
}
function resolve(t){if(!mem[t])resolveMany([t]);return mem[t];}
function forget(t){delete store[t];delete mem[t];saveStore();}
function loadImg(u){
  if(!imgP[u])imgP[u]=new Promise(res=>{const im=new Image();im.onload=()=>res(true);im.onerror=()=>{delete imgP[u];res(false);};im.src=u;});
  return imgP[u];
}
function upcoming(from,n){const a=[];for(let i=from;i<order.length&&a.length<n;i++){const t=titleOf(cur.items[order[i]]);if(t)a.push(t);}return a;}
function netFail(){fails++;if((fails>=3||navigator.onLine===false)&&!warned){warned=true;toast('📶 しゃしんを よみこめません（えもじで ひょうじします）');}}
let toastUntil=0;
function toast(t){hint.textContent=t;hint.classList.remove('off');toastUntil=Date.now()+4000;setTimeout(()=>{if(Date.now()>=toastUntil)hint.classList.add('off');},4000);}
function niceName(n){return n.replace(/_/g,' ').replace(/\.(jpe?g|png|gif|svg|tiff?|webp)$/i,'');}
function prefetch(i){
  if(!S.photo||i>=order.length)return;
  const t=titleOf(cur.items[order[i]]);if(!t)return;
  resolve(t).then(r=>{if(r)loadImg(r.u);});
}

/* ---- ホーム ---- */
function buildHome(){
  const wrap=$('#groups');wrap.innerHTML='';let total=0;
  GROUPS.forEach((g,gi)=>{
    const decks=DECKS.filter(d=>d.g===gi);if(!decks.length)return;
    const n=decks.reduce((a,d)=>a+d.items.length,0);
    const h=document.createElement('h2');h.className='gh';h.innerHTML=`${g}<span>${decks.length}カテゴリ・${n}まい</span>`;wrap.appendChild(h);
    const grid=document.createElement('div');grid.className='grid';
    decks.forEach(d=>{
      total+=d.items.length;
      const b=document.createElement('button');b.className='deck';b.style.background=d.color;
      b.innerHTML=`<div class="ic">${d.icon}</div><div class="nm">${d.name}</div><div class="en">${d.en} ・ ${d.items.length}まい</div>`;
      b.onclick=()=>start(d);grid.appendChild(b);
    });
    wrap.appendChild(grid);
  });
  $('#total').textContent=`${DECKS.length}カテゴリ ・ ぜんぶで ${total}まい`;
  syncToggles();
}
function syncToggles(){
  $('#tShuffle').classList.toggle('on',S.shuffle);$('#tEn').classList.toggle('on',S.en);$('#tPhoto').classList.toggle('on',S.photo);
  $('#tAuto').classList.toggle('on',S.auto>0);$('#tAuto').textContent='⏱ オート: '+(S.auto?S.auto+'びょう':'オフ');
}
$('#tShuffle').onclick=()=>{S.shuffle=!S.shuffle;save();syncToggles();};
$('#tEn').onclick=()=>{S.en=!S.en;save();syncToggles();};
$('#tPhoto').onclick=()=>{S.photo=!S.photo;save();syncToggles();};
$('#tAuto').onclick=()=>{const a=[0,1,2,3];S.auto=a[(a.indexOf(S.auto)+1)%a.length];save();syncToggles();};
$('#mix').onclick=()=>{const pool=[];DECKS.forEach(d=>{if(!d.nophoto)d.items.forEach(it=>pool.push(it));});shuffle(pool);
  start({name:'ランダム',en:'Random mix',icon:'🎲',items:pool.slice(0,30)});};
const fsBtn=$('#tFs');
if(document.documentElement.requestFullscreen){
  fsBtn.onclick=()=>{document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen().catch(()=>{});};
  document.addEventListener('fullscreenchange',()=>fsBtn.classList.toggle('on',!!document.fullscreenElement));
}else fsBtn.style.display='none';

/* ---- カード ---- */
let cur=null,order=[],idx=0,ended=false,timer=null,lastTap=0,wl=null,token=0;
function start(d){
  cur=d;order=d.items.map((_,k)=>k);if(S.shuffle)shuffle(order);
  idx=0;ended=false;home.style.display='none';card.classList.add('show');
  hint.textContent='タップで つぎへ 👉';hint.classList.remove('off');
  show();keepAwake();startAuto();
}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}}
function drawn(v){
  if(v.color)return `<div class="ball" style="background:${v.color}"></div>`;
  if(v.shape)return `<svg viewBox="0 0 100 100" fill="${v.fill}">${SHAPES[v.shape]}</svg>`;
  if(v.num){const c=NUMCOL[(v.num-1)%NUMCOL.length];return `<div class="numwrap"><div class="num" style="color:${c}">${v.num}</div><div class="dots">${`<i style="background:${c}"></i>`.repeat(v.num)}</div></div>`;}
  return '';
}
function clearPhoto(){photo.classList.remove('on');photo.removeAttribute('src');bgblur.classList.remove('on');emoji.classList.remove('off');credit.textContent='';}
function applyPhoto(r){
  photo.src=r.u;bgblur.style.backgroundImage=`url("${r.u}")`;
  photo.classList.add('on');bgblur.classList.add('on');emoji.classList.add('off');
  credit.textContent='📷 '+(r.n?niceName(r.n)+' / ':'')+'Wikimedia Commons';
}
function show(){
  const tk=++token,it=cur.items[order[idx]],[v,ja,enTxt]=it;
  card.style.background=cur.bg||PALETTE[idx%PALETTE.length];
  clearPhoto();
  emoji.innerHTML=(typeof v==='string')?v:drawn(v);
  word.textContent=ja;word.classList.toggle('long',ja.length>=7&&ja.length<10);word.classList.toggle('xl',ja.length>=10);
  en.textContent=enTxt;en.classList.toggle('hide',!S.en);
  endbtns.style.display='none';
  counter.textContent=`${idx+1} / ${order.length}`;prog.style.width=((idx+1)/order.length*100)+'%';
  pop();
  const t=titleOf(it);
  if(S.photo&&t){
    resolveMany(upcoming(idx,50));
    resolve(t).then(r=>{
      if(!r||tk!==token)return;
      loadImg(r.u).then(ok=>{if(ok){fails=0;if(tk===token)applyPhoto(r);}else{forget(t);netFail();}});
    });
    prefetch(idx+1);prefetch(idx+2);prefetch(idx+3);
  }
}
function pop(){stage.classList.remove('pop');void stage.offsetWidth;stage.classList.add('pop');}
function advance(fromTimer){
  const now=Date.now();
  if(!fromTimer){if(now-lastTap<350)return;lastTap=now;}
  if(now>toastUntil)hint.classList.add('off');
  if(ended){restart();return;}
  if(idx<order.length-1){idx++;show();if(!fromTimer)startAuto();}else showEnd();
}
function back(){if(ended){ended=false;show();startAuto();return;}if(idx>0){idx--;show();startAuto();}}
function showEnd(){
  ended=true;stopAuto();token++;clearPhoto();
  card.style.background='#FFF4C2';emoji.innerHTML='🎉';
  word.textContent='おしまい！';word.className='word';en.textContent='Great job!';en.classList.remove('hide');
  endbtns.style.display='flex';counter.textContent=`${order.length} / ${order.length}`;prog.style.width='100%';pop();
}
function restart(){if(S.shuffle)shuffle(order);idx=0;ended=false;hint.classList.add('off');show();startAuto();}
function goHome(){stopAuto();releaseAwake();token++;card.classList.remove('show');home.style.display='';}
function startAuto(){stopAuto();if(S.auto>0){timer=setInterval(()=>advance(true),S.auto*1000);badge.textContent='⏱ '+S.auto+'びょう';}else badge.textContent='';}
function stopAuto(){if(timer){clearInterval(timer);timer=null;}}
$('#btnHome').onclick=goHome;$('#btnHome2').onclick=goHome;$('#btnAgain').onclick=restart;

/* ---- タップ・スワイプ ---- */
let pdown=false,pid=0,px=0,py=0;
card.addEventListener('pointerdown',e=>{if(e.target.closest('button')||pdown)return;pdown=true;pid=e.pointerId;px=e.clientX;py=e.clientY;});
card.addEventListener('pointerup',e=>{
  if(e.target.closest('button')||!pdown||e.pointerId!==pid)return;pdown=false;
  const dx=e.clientX-px,dy=e.clientY-py;
  if(Math.abs(dx)>60&&Math.abs(dx)>Math.abs(dy)*1.5){dx<0?advance():back();}else advance();
});
card.addEventListener('pointercancel',()=>{pdown=false;});
document.addEventListener('contextmenu',e=>e.preventDefault());
document.addEventListener('keydown',e=>{
  if(!card.classList.contains('show'))return;
  if(e.key==='ArrowRight'||e.key===' '||e.key==='Enter'){e.preventDefault();advance();}
  else if(e.key==='ArrowLeft')back();else if(e.key==='Escape')goHome();
});

/* ---- 画面を消灯させない ---- */
async function keepAwake(){try{if(navigator.wakeLock&&!wl){wl=await navigator.wakeLock.request('screen');wl.addEventListener('release',()=>{wl=null;});}}catch(e){}}
function releaseAwake(){try{if(wl){wl.release();wl=null;}}catch(e){}}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&card.classList.contains('show'))keepAwake();});

buildHome();
</script>
